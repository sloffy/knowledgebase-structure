spring.application.name=structure
spring.config.import=optional:file:.env[.properties]
spring.main.web-application-type=${APP_MODE:servlet}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:water_knowledge}}
spring.datasource.username=${DB_USERNAME:water_knowledge}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
# Keep unique constraints without dropping them on every schema update.
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
spring.main.banner-mode=off
logging.level.root=WARN
app.console.enabled=${CONSOLE_ENABLED:false}
app.demo.seed=${DEMO_SEED:true}
app.demo.include=${DEMO_INCLUDE:true}
