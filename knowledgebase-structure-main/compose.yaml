services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-water_knowledge}
      POSTGRES_USER: ${DB_USERNAME:-water_knowledge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  knowledge-data:
